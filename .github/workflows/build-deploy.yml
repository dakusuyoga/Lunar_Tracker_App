# Builds the app and publishes source + built `dist/` to the `deploy`
# branch, which the server's deploy script tracks. This is what removes
# the "did I remember to rebuild?" problem: `main` stays source-only
# (dist/ is gitignored there), and every push to main produces a fresh
# build here automatically.
#
# Server side: BRANCH="deploy" in /usr/local/bin/deploy-lunar-daxyogatherapy.sh
# Nginx root stays <release>/dist.
name: Build and publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    # Only the private working repo deploys to the server. The public
    # mirror publishes GitHub Pages instead (see deploy.yml).
    if: github.repository == 'dakusuyoga/LunarTrackerApp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Sanity check: the build must contain the engine files, or the
      # server would serve an app that cannot calculate anything.
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/swisseph.wasm
          test -f dist/sw.js
          test -f dist/ephe/sepl_18.se1
          test -f dist/ephe/semo_18.se1
          test -f dist/ephe/seas_18.se1
          echo "build output verified"

      - name: Publish to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The deploy branch = this commit's source plus the built dist/.
          # -f overrides .gitignore, which excludes dist/ on main.
          git checkout -B deploy
          git add -f dist
          git commit -m "Build from ${GITHUB_SHA::7}" || echo "no changes to publish"
          git push -f origin deploy
